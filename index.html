<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Document</title>
</head>
<body>
 <p>
    <!DOCTYPE html>
    <html lang="ja">
    <head>
        <meta charset="UTF-8">
        <title>丸亀_仕込みチェック表</title>
        <style>
            body{background-color: aqua;font-family: sans-serif;}
            h1,h2{text-align: center;}
            .box{background-color: darkgray;margin: 0 auto;width: 90%;padding: 10px;position: relative;}
            .nyuryoku{background-color: white;padding: 10px;min-height: 300px;}
            .edit-btn{position: absolute;top: 10px;right: 10px;background: orange;border: none;padding: 10px 40px;font-size: 30px;cursor: pointer;border-radius: 5px;}
            .item{display: flex;align-items: center;gap: 10px;padding: 6px 0;border-bottom: 1px solid #ccc;font-size: 20px;}
            .item select{padding: 4px;width: 100px;}
            .item input[type="text"]{width: 150px;font-size: 20px;}
            .item input[type="number"]{width: 60px;font-size: 20px;}
            .item input:disabled,
            .item select:disabled {color: black;opacity: 1;}
            .delete-btn{background: red;color: white;border: none;padding: 4px 8px;border-radius: 4px;cursor: pointer;}
            .add-area{margin: 10px 0 5px 0;text-align: center;display: none;}
            .add-area input, .add-area select{margin-right: 5px;}
            #topButtons{display: flex;align-items: center;gap: 10px;margin-bottom: 10px;flex-wrap: wrap;}
            .filterBtn{font-size: 20px;background: #ddd;border: none;padding: 6px 12px;border-radius: 5px;cursor: pointer;}
            .filterBtn.active{background: orange;color: white;}
            #categoryButtons{display: flex;flex-wrap: wrap;gap: 5px;margin-bottom: 10px;}
            .catBtn{background: #ddd;border: none;padding: 6px 10px;border-radius: 5px;cursor: pointer;font-size: 20px}
            .catBtn.active{background: green;color: white;}
            #resetBtn,#searchInput{font-size: 20px;}
            @page {margin: 10mm;}
            @media print {
                body {background: white;-webkit-print-color-adjust: exact;print-color-adjust: exact;}
                .box {background: white;}
                #topButtons,#categoryButtons,.edit-btn,.add-area,#printBtn {display: none !important;}
                .item input[type="checkbox"] {display: none !important;}
                .item {border-bottom: 1px solid #000;}
                .item input,.item select,.item span {font-size: 16px;color: black !important;}}
            #printBtn{position: absolute;top: 10px;left: 10px;background: yellow;border: none;padding: 10px 40px;font-size: 30px;cursor: pointer;border-radius: 5px;}
        </style>
    </head>
    <body>
    <h1>丸亀_仕込み</h1>
    <button id="printBtn">印刷</button>
    <button class="edit-btn" id="editBtn">編集</button>
    <div class="box">
        <div id="topButtons">
            <button id="resetBtn">チェックのリセット</button>
            <button class="filterBtn" data-mode="all" id="filterAll">全て</button>
            <button class="filterBtn" data-mode="checked" id="filterChecked">チェック済み</button>
            <button class="filterBtn" data-mode="unchecked" id="filterUnchecked">未チェック</button>
            <input type="text" id="searchInput" placeholder="検索">
        </div>
        <div id="categoryButtons">
            <button class="catBtn" data-cat="all">全て</button>
            <button class="catBtn" data-cat="製麺">製麺</button>
            <button class="catBtn" data-cat="湯煎">湯煎</button>
            <button class="catBtn" data-cat="天ぷら">天ぷら</button>
            <button class="catBtn" data-cat="火口">火口</button>
            <button class="catBtn" data-cat="レジ">レジ</button>
            <button class="catBtn" data-cat="洗い場">洗い場</button>
            <button class="catBtn" data-cat="その他">その他</button>
        </div>
        <div class="add-area" id="addArea">
            <input type="text" id="newName" placeholder="内容">
            <input type="number" id="newQty" placeholder="数量">
            <select id="newCategory">
                <option value="製麺">製麺</option>
                <option value="湯煎">湯煎</option>
                <option value="天ぷら">天ぷら</option>
                <option value="火口">火口</option>
                <option value="レジ">レジ</option>
                <option value="洗い場">洗い場</option>
                <option value="その他">その他</option>
            </select>
            <button id="addBtn">追加</button>
        </div>
        <div class="nyuryoku" id="listArea"></div>
    </div>
    <script>
        let filterMode = "all";        
        let searchWord = "";           
        let categoryFilter = "all";    
        let items = JSON.parse(localStorage.getItem("shikomiData")) || [{ checked: false, name: "かけだし", qty: 1, category: "湯煎" }];
        const listArea = document.getElementById("listArea");
        const editBtn = document.getElementById("editBtn");
        const addArea = document.getElementById("addArea");
        const addBtn = document.getElementById("addBtn");
        function renderList(){
            listArea.innerHTML = "";
            items.forEach((item, index) => {
                if(filterMode === "checked" && !item.checked) return;
                if(filterMode === "unchecked" && item.checked) return;
                if(categoryFilter !== "all" && item.category !== categoryFilter) return;
                if(searchWord !== "" && !item.name.includes(searchWord)) return;
                const div = document.createElement("div");
                div.className = "item";
                const check = document.createElement("input");
                check.type = "checkbox";
                check.checked = item.checked;
                check.onclick = () => {
                    item.checked = check.checked;
                    saveData();
                    renderList();};
                let cat;
                if(isEditMode){
                    cat = document.createElement("select");
                    ["製麺","湯煎","天ぷら","火口","レジ","洗い場","その他"].forEach(c => {
                        const op = document.createElement("option");
                        op.value = c;
                        op.textContent = c;
                        if(item.category === c) op.selected = true;
                        cat.appendChild(op);});
                    cat.onchange = () => {
                        item.category = cat.value;
                        saveData();};
                } else {
                    cat = document.createElement("span");
                    cat.textContent = item.category;
                    cat.style.fontWeight = "bold";}
                const name = document.createElement("input");
                name.type = "text";
                name.value = item.name;
                name.disabled = !isEditMode;
                name.onchange = () => {
                    item.name = name.value;
                    saveData();};
                const qty = document.createElement("input");
                qty.type = "number";
                qty.value = item.qty;
                qty.disabled = !isEditMode;
                qty.onchange = () => {
                    item.qty = Number(qty.value);
                    saveData();};
                const del = document.createElement("button");
                del.textContent = "削除";
                del.className = "delete-btn";
                del.style.display = isEditMode ? "inline-block" : "none";
                del.onclick = () => {
                    items.splice(index, 1);
                    saveData();
                    renderList();};
                div.appendChild(check);
                div.appendChild(cat);
                div.appendChild(name);
                div.appendChild(qty);
                div.appendChild(del);
                listArea.appendChild(div);});}
        printBtn.onclick = () => {window.print();};
        function saveData(){localStorage.setItem("shikomiData", JSON.stringify(items));}
        let isEditMode = false;
        editBtn.onclick = () => {
            isEditMode = !isEditMode;
            editBtn.textContent = isEditMode ? "終了" : "編集";
            addArea.style.display = isEditMode ? "block" : "none";
            renderList();};
        addBtn.onclick = () => {
            const name = document.getElementById("newName").value;
            const qty = Number(document.getElementById("newQty").value);
            const category = document.getElementById("newCategory").value;
            if(name === "" || qty <= 0){
                alert("内容と数量を入力してください");
                return;}
            items.push({ checked: false, name, qty, category });
            saveData();
            renderList();
            document.getElementById("newName").value = "";
            document.getElementById("newQty").value = "";};
        resetBtn.onclick = () => {
            if(confirm("リセットしますか？")){
                items.forEach(item => item.checked = false);
                saveData();
                renderList();}};
        const filterButtons = document.querySelectorAll(".filterBtn");
        filterButtons.forEach(btn => {
            btn.onclick = () => {
                filterMode = btn.dataset.mode;
                filterButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderList();};});
        const catButtons = document.querySelectorAll(".catBtn");
        catButtons.forEach(btn => {
            btn.onclick = () => {
                categoryFilter = btn.dataset.cat;
                catButtons.forEach(b => b.classList.remove("active"));
                btn.classList.add("active");
                renderList();};});
        searchInput.oninput = () => {
            searchWord = searchInput.value;
            renderList();};
        renderList();
    </script>
    </body>
    </html>
</p>   
</body>
</html>
